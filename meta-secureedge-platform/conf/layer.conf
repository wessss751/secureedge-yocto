BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-secureedge-platform"
BBFILE_PATTERN_meta-secureedge-platform = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-secureedge-platform = "6"

LAYERDEPENDS_meta-secureedge-platform = "core"
LAYERSERIES_COMPAT_meta-secureedge-platform = "scarthgap"
