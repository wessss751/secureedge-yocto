[system]
compatible=secureedge-rpi-zero2w
bootloader=noop
bundle-formats=-plain
mountprefix=/mnt/rauc
data-directory=/data/rauc
[keyring]
path=ca.cert.pem

[slot.rootfs.0]
device=/dev/mmcblk0p5
type=ext4
bootname=system0

[slot.boot.0]
device=/dev/mmcblk0p2
type=vfat
parent=rootfs.0

[slot.rootfs.1]
device=/dev/mmcblk0p6
type=ext4
bootname=system1

[slot.boot.1]
device=/dev/mmcblk0p3
type=vfat
parent=rootfs.1
