BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-secureedge-distro"
BBFILE_PATTERN_meta-secureedge-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-secureedge-distro = "6"

LAYERDEPENDS_meta-secureedge-distro = "core"
LAYERSERIES_COMPAT_meta-secureedge-distro = "scarthgap"
